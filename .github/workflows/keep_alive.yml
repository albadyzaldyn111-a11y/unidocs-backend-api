name: Keep Render Alive 24/7

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping UniDocs Backend
        run: |
          curl -s https://unidocs-backend-api.onrender.com/health
          echo "Ping sent to UniDocs Backend at $(date)"
